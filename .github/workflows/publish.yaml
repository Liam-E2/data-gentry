name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag matches version
        run: |
          VERSION=$(python - <<'EOF'
          import tomllib
          print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])
          EOF
          )
          TAG=${GITHUB_REF#refs/tags/v}

          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match version $VERSION"
            exit 1
          fi

      - name: Build
        uses: astral-sh/setup-uv@v7
        run: uv build

      - name: Publish via PyPI Trusted Publisher
        uses: astral-sh/setup-uv@v7
        run: uv publish
