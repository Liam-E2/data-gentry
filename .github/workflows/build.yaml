name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.9.16"
    - name: Sync dependencies
      run: uv sync
    - name: Lint
      run: uv run mypy
    - name: Test
      run: uv run pytest